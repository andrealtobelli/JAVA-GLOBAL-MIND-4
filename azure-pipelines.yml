# ==========================================
# 🚀 Pipeline CI + CD - Projeto MindTrack (Java)
# ==========================================
# Este pipeline:
#  1️⃣ Executa build, testes e publica artefatos (CI)
#  2️⃣ Faz deploy automático no Azure App Service (CD)
# ==========================================

trigger:
  branches:
    include:
      - main   # Build é acionado apenas após merge via PR

pool:
  vmImage: 'ubuntu-latest'

variables:
  mavenPomFile: 'nexus/pom.xml'
  buildConfiguration: 'Release'
  artifactName: 'mindtrack-drop'
  webAppName: 'mindtrack-nexus-app'             # Nome do Web App no Azure
  azureSubscription: 'nexus-azure-conn'         # Service connection configurada no Azure DevOps
  packagePath: '$(Build.ArtifactStagingDirectory)/publish_output'

# ================================
# 🧱 STAGE 1: Build, Test & Publish
# ================================
stages:
  - stage: Build
    displayName: 'Build, Testes e Publicação do MindTrack'
    jobs:
      - job: BuildJob
        displayName: 'Compilar, testar e publicar o projeto Java'
        steps:
          - checkout: self

          - task: Maven@3
            displayName: 'Compilar e testar o projeto com Maven'
            inputs:
              mavenPomFile: '$(mavenPomFile)'
              goals: 'clean package'
              options: '-Dmaven.test.failure.ignore=false'
              publishJUnitResults: true
              testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false

          - script: |
              echo "📦 Movendo artefato gerado..."
              mkdir -p $(packagePath)
              cp nexus/target/*.jar $(packagePath)
            displayName: 'Preparar artefato para publicação'

          - task: ArchiveFiles@2
            displayName: 'Compactar artefatos em .zip'
            inputs:
              rootFolderOrFile: '$(packagePath)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefato para o pipeline'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: '$(artifactName)'

# ================================
# 🚀 STAGE 2: Deploy no Azure App Service
# ================================
  - stage: Deploy
    displayName: 'Deploy automático no Azure App Service (MindTrack)'
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployJob
        displayName: 'Publicar MindTrack no App Service Nexus'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy no App Service (MindTrack)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/mindtrack-drop/mindtrack-drop.zip'
                    deploymentMethod: 'auto'

                - script: |
                    echo "✅ Deploy concluído com sucesso no App Service: $(webAppName)"
                  displayName: 'Confirmação do deploy'
